name: Native macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Native tests and dictionary checks
        run: native/check.sh
      - name: Compile universal distribution bundle
        run: |
          native/assemble.sh "$RUNNER_TEMP/TrackpadSwipe.app" universal
          lipo -archs "$RUNNER_TEMP/TrackpadSwipe.app/Contents/MacOS/TrackpadType" | python3 -c 'import sys; assert set(sys.stdin.read().split()) == {"arm64", "x86_64"}'
